name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          echo '### Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |What went wrong|error:|Execution failed|Caused by' -A3 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusic-apk
          path: app/build/outputs/apk/release/*.apk
